<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305 92" role="img" aria-labelledby="title">
  <title id="title">CMOC</title>
  <defs>
    <filter id="white-outline" x="-8%" y="-12%" width="116%" height="124%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="expanded"/>
      <feFlood flood-color="#ffffff" result="outline-color"/>
      <feComposite in="outline-color" in2="expanded" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <image width="305" height="92" href="data:image/png;base64," filter="url(#white-outline)"/>
</svg>
