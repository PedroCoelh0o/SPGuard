name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Build do app web (gera .output com o servidor Node)
        run: npm run build

      - name: Empacotar instalador Windows (NSIS)
        run: npx electron-builder --win nsis --publish never

      - name: Publicar instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: biz-people-nexus-windows-installer
          path: dist_electron/*.exe
