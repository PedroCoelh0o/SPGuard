name: Build Windows Installer

# Gera o instalador (.exe) do Biz People Nexus para Windows usando um
# runner windows-latest de verdade (evita os problemas de cross-compile
# ao tentar gerar um .exe a partir do Linux/macOS).
#
# Como usar:
#   1. Vá em Actions -> "Build Windows Installer" -> "Run workflow".
#   2. Quando terminar, baixe o artifact "spguard-windows-installer".
#   3. Dentro do zip está o instalador .exe pronto para rodar no Windows.
#
# Também roda automaticamente a cada push na branch main.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # Fixado em "windows-2022" (em vez de "windows-latest") porque essa
    # imagem vem com Visual Studio 2022 "clássico" instalado. A imagem
    # mais recente do windows-latest passou a vir com uma versão nova
    # demais do Visual Studio que a ferramenta de recompilação de módulos
    # nativos do Electron (@electron/rebuild) ainda não reconhece — um
    # bug conhecido deles, sem previsão de correção no momento.
    runs-on: windows-2022
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      # O better-sqlite3 é um módulo nativo e precisa ser compilado para a
      # versão exata do Electron. A compilação usa o MSBuild do VS 2022.
      - name: Localizar o MSBuild e configurar o node-gyp
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "Procurando vswhere em: $vswhere"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe não encontrado em $vswhere"
            exit 1
          }
          $msbuild = & $vswhere -products * -version "[17.0,18.0)" -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            Write-Host "Visual Studio 2022 não encontrado, tentando a versão mais recente disponível..."
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          }
          if (-not $msbuild) {
            Write-Error "MSBuild não encontrado pelo vswhere."
            exit 1
          }
          Write-Host "MSBuild encontrado em: $msbuild"
          echo "npm_config_msbuild_path=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # IMPORTANTE: este passo tem que rodar ANTES do build do app. O
      # build (Nitro) copia o better-sqlite3 que estiver em node_modules
      # nesse momento para dentro do pacote final — se recompilarmos
      # DEPOIS do build, a versão recompilada nunca chegaria no instalador.
      - name: Recompilar better-sqlite3 para o Electron
        run: npm run rebuild:native
        env:
          DEBUG: "electron-rebuild"
          # O node-gyp não usa npm_config_msbuild_path para escolher a
          # instalação do Visual Studio. Estas duas variáveis são a forma
          # suportada de fixar a versão do compilador no Windows.
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"

      - name: "[Diagnóstico] Verificar onde está o binário compilado"
        shell: pwsh
        run: |
          $nodeFile = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          Write-Host "=== build/Release/better_sqlite3.node ==="
          if (Test-Path $nodeFile) {
            Get-Item $nodeFile | Select-Object FullName, Length, LastWriteTime | Format-List
          } else {
            Write-Host "NÃO EXISTE"
          }

          Write-Host "=== Todos os arquivos .node dentro de node_modules/better-sqlite3 ==="
          Get-ChildItem -Recurse -Filter "*.node" node_modules/better-sqlite3 | Select-Object FullName, Length, LastWriteTime | Format-List

          Write-Host "=== Conteúdo de build/Release (só a raiz, sem entrar em obj/) ==="
          Get-ChildItem node_modules/better-sqlite3/build/Release | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

          # Sem este arquivo o instalador abre, mas toda operação que toca o
          # banco (por exemplo, cadastrar empresa ou colaborador) falha.
          if (-not (Test-Path $nodeFile)) {
            Write-Error "O binário nativo better_sqlite3.node não foi gerado."
            exit 1
          }

      - name: Validar o SQLite dentro do runtime do Electron
        shell: pwsh
        run: |
          # ELECTRON_RUN_AS_NODE preserva o ABI do Electron, diferente de
          # testar com node.exe, que rejeitaria um módulo compilado para o
          # Electron. A criação de uma tabela confirma que o addon carregou.
          $env:ELECTRON_RUN_AS_NODE = "1"
          & .\node_modules\.bin\electron.cmd -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.exec('CREATE TABLE healthcheck (id INTEGER)'); db.close(); console.log('SQLite no Electron: OK');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build do app web (gera .output com o servidor Node)
        run: npm run build

      - name: Empacotar instalador Windows (NSIS)
        run: npx electron-builder --win nsis --publish never

      - name: Publicar instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: spguard-windows-installer
          path: dist_electron/*.exe
