name: Build Windows Installer

# Gera o instalador (.exe) do Biz People Nexus para Windows usando um
# runner windows-latest de verdade (evita os problemas de cross-compile
# ao tentar gerar um .exe a partir do Linux/macOS).
#
# Como usar:
#   1. Vá em Actions -> "Build Windows Installer" -> "Run workflow".
#   2. Quando terminar, baixe o artifact "biz-people-nexus-windows-installer".
#   3. Dentro do zip está o instalador .exe pronto para rodar no Windows.
#
# Também roda automaticamente a cada push na branch main.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      # O better-sqlite3 é um módulo nativo (binário compilado). O binário
      # que vem pronto no pacote não é compatível com o runtime do
      # Electron (só com Node.js puro) — precisa ser recompilado
      # especificamente para o Electron. Isso exige um compilador C++
      # (Visual Studio Build Tools), que o runner windows-latest já tem
      # instalado, mas o node-gyp às vezes não acha sozinho; esta ação
      # garante que as variáveis de ambiente do MSVC fiquem configuradas.
      - name: Configurar Visual Studio (MSVC) para compilar módulos nativos
        uses: ilammy/msvc-dev-cmd@v1

      # IMPORTANTE: este passo tem que rodar ANTES do build do app. O
      # build (Nitro) copia o better-sqlite3 que estiver em node_modules
      # nesse momento para dentro do pacote final — se recompilarmos
      # DEPOIS do build, a versão recompilada nunca chegaria no instalador.
      - name: Recompilar better-sqlite3 para o Electron
        run: npm run rebuild:native

      - name: Build do app web (gera .output com o servidor Node)
        run: npm run build

      - name: Empacotar instalador Windows (NSIS)
        run: npx electron-builder --win nsis --publish never

      - name: Publicar instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: biz-people-nexus-windows-installer
          path: dist_electron/*.exe
